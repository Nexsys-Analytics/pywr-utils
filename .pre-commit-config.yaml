default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.2
    hooks:
      # Auto-fix lint issues on staged files and block the commit if any finding remains after the fix. The codebase reached zero findings under the real default ruleset (see the fix/remaining-ruff-findings PR chain), so this hook now enforces that state locally, matching CI's ruff check . rather than just warning about drift from it.
      - id: ruff-check
        args: [--fix]

  - repo: local
    hooks:
      - id: gitleaks-pre-push
        name: gitleaks (scan commits about to be pushed)
        language: system
        pass_filenames: false
        stages: [pre-push]
        entry: >-
          bash -c '
            UPSTREAM=$(git rev-parse --abbrev-ref --symbolic-full-name @{upstream} 2>/dev/null || echo "");
            if [ -n "$UPSTREAM" ]; then RANGE="${UPSTREAM}..HEAD"; else RANGE="-1 HEAD"; fi;
            echo "Scanning commit range: $RANGE";
            gitleaks detect --source . --log-opts="$RANGE" --config .gitleaks.toml --redact --verbose
          '
