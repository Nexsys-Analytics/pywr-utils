name: Test minimal install
description: Regression guard for the model_runner lazy-import bug -- a plain install with no extras, with neither pandas nor pywr present, must still let create-synthetic-model run. Extracted so this repo's own CI and mono's synced copy of this repo can call the identical steps locally -- see the "Sharing CI with the monorepo" pattern already shipped for the infrastructure repo.

inputs:
  working-directory:
    description: Directory containing the Python project (pyproject.toml, setup.py) to install
    required: false
    default: "."

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: |
          ${{ inputs.working-directory }}/pyproject.toml
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv pip install --system .
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        pywr-utils create-synthetic-model --zones 2 --transfers 1 --output /tmp/synthetic.json --show-summary
        test -f /tmp/synthetic.json
    - name: confirm pandas and pywr are genuinely absent
      shell: bash
      run: |
        ! python -c "import pandas" 2>/dev/null
        ! python -c "import pywr" 2>/dev/null
