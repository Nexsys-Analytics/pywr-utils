name: Test
description: Runs the pytest suite and writes a coverage summary/report. Extracted so this repo's own CI and mono's synced copy of this repo can call the identical steps locally -- see the "Sharing CI with the monorepo" pattern already shipped for the infrastructure repo.

inputs:
  working-directory:
    description: Directory containing the Python project (pyproject.toml, setup.py) to test
    required: false
    default: "."

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: |
          ${{ inputs.working-directory }}/pyproject.toml
    - name: install system dependency (glpk)
      # pywr's lpsolve extension needs headers this runner doesn't have; glpk (also needed) is installed here via apt.
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libglpk-dev
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PYWR_BUILD_LPSOLVE: "false"
      run: uv pip install --system -e ".[run,dev]"
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pytest -v
    - name: write coverage summary
      # Fully native, no admin-gated feature or third-party action needed: coverage.py's own markdown formatter piped into GitHub Actions' own step-summary mechanism. Shows up on every run's summary page (and one click away from the PR checks list) regardless of whether Code Quality is ever enabled.
      if: always()
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo '## Coverage' >> "$GITHUB_STEP_SUMMARY"
        python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
    - name: upload coverage report
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      uses: actions/upload-code-coverage@v1
      with:
        file: ${{ inputs.working-directory }}/coverage.xml
        language: Python
        label: code-coverage/pytest
        # TEMPORARY: Code Quality isn't enabled for this repo yet (Settings > Security > Code quality) -- that's an org/repo admin action, and neither CI nor a push-only collaborator can do it. Without this, the upload 403s and fails the whole job. Remove fail-on-error once an admin enables Code Quality and this step succeeds for real.
        fail-on-error: false
