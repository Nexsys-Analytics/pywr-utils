name: Typecheck, lint, and security scan
description: Runs mypy, ruff, vulture, bandit, and pip-audit against the Python source tree. Extracted so this repo's own CI and mono's synced copy of this repo can call the identical steps locally -- see the "Sharing CI with the monorepo" pattern already shipped for the infrastructure repo.

inputs:
  working-directory:
    description: Directory containing the Python project (pyproject.toml, setup.py) to check
    required: false
    default: "."

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: |
          ${{ inputs.working-directory }}/pyproject.toml
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv pip install --system -e ".[dev]"
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: mypy pywr_utils/
    - name: lint (ruff)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ruff check .
    - name: dead-code scan (vulture)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: vulture pywr_utils vulture_whitelist.py --min-confidence 80
    - name: security scan (bandit)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bandit -r pywr_utils
    - name: dependency vulnerability scan (pip-audit)
      # pip itself is not a declared dependency, just whatever setup-python provisions; keep it current so a stale bundled pip doesn't produce a false CVE finding here.
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        pip install -U pip
        pip-audit --skip-editable
