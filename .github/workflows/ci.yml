name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read
  code-quality: write

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mypy pywr_utils/
      - name: lint (ruff)
        run: ruff check .
      - name: dead-code scan (vulture)
        run: vulture pywr_utils vulture_whitelist.py --min-confidence 80
      - name: security scan (bandit)
        run: bandit -r pywr_utils
      - name: dependency vulnerability scan (pip-audit)
        # pip itself is not a declared dependency, just whatever setup-python provisions; keep it current so a stale bundled pip doesn't produce a false CVE finding here.
        run: |
          pip install -U pip
          pip-audit --skip-editable

  test:
    runs-on: ubuntu-latest
    env:
      # pywr's lpsolve extension needs headers this runner doesn't have; glpk (also needed) is installed below via apt.
      PYWR_BUILD_LPSOLVE: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libglpk-dev
      - run: pip install -e ".[run,dev]"
      - run: pytest -v
      - name: write coverage summary
        # Fully native, no admin-gated feature or third-party action needed: coverage.py's own markdown formatter piped into GitHub Actions' own step-summary mechanism. Shows up on every run's summary page (and one click away from the PR checks list) regardless of whether Code Quality is ever enabled.
        if: always()
        run: |
          echo '## Coverage' >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: upload coverage report
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Python
          label: code-coverage/pytest
          # TEMPORARY: Code Quality isn't enabled for this repo yet (Settings > Security > Code quality) — that's an org/repo admin action, and neither CI nor a push-only collaborator can do it. Without this, the upload 403s and fails the whole job. Remove fail-on-error once an admin enables Code Quality and this step succeeds for real.
          fail-on-error: false

  test-minimal-install:
    # Regression guard for the model_runner lazy-import bug: a plain `pip install .`, with neither pandas nor pywr present, must still let create-synthetic-model run — only the `run` extra needs either.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: |
          pywr-utils create-synthetic-model --zones 2 --transfers 1 --output /tmp/synthetic.json --show-summary
          test -f /tmp/synthetic.json
      - name: confirm pandas and pywr are genuinely absent
        run: |
          ! python -c "import pandas" 2>/dev/null
          ! python -c "import pywr" 2>/dev/null
