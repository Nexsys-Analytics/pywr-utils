name: gitleaks

# Scan only the NEW commits of each push / PR for secrets, matching the pattern already established on cluster-api-v2. No known historical-secret backlog exists in this repo, but scanning new commits only (rather than full history on every run) keeps this consistent with the rest of the org and cheap to run.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gitleaks:
    # GitHub-hosted: the repository is public, so the organisation's private-only runner group never serves it. The binary runs from the workspace by path, so no sudo is needed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/gitleaks
