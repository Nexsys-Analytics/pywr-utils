name: gitleaks

# Scan only the NEW commits of each push / PR for secrets, matching the pattern already established on cluster-api-v2. No known historical-secret backlog exists in this repo, but scanning new commits only (rather than full history on every run) keeps this consistent with the rest of the org and cheap to run.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    # Self-hosted fleet: the org's billing block stops GitHub-hosted jobs, and the runner container has no sudo -- the binary runs from the workspace by path.
    runs-on: gha-ci-runners
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/gitleaks
