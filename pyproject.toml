[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pywr-utils"
version = "0.1.0"
description = "Utilities for PYWR water resource modeling"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "click>=8.0.0",
]

[project.optional-dependencies]
run = ["pandas", "pywr"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.10", "pandas-stubs", "vulture>=2.11"]

[project.scripts]
pywr-utils = "pywr_utils.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pywr_utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pywr_utils --cov-report=term-missing --cov-report=xml"

[tool.coverage.report]
# Ratchet, not an aspirational target: set at today's measured coverage (29.05%) minus a small buffer for environment variance, so coverage can't silently regress further without failing CI. Raise this number as coverage genuinely improves.
fail_under = 27

[[tool.mypy.overrides]]
# pywr ships no type stubs and no py.typed marker (not a types-pywr package situation — it's a niche scientific library that's simply untyped).
module = "pywr.*"
ignore_missing_imports = true
